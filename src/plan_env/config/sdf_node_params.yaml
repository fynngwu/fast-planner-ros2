sdf_node:
  ros__parameters:
    # ESDF resolution: match grid resolution for full detail
    resolution: 0.05
    
    # Map size (meters)
    map_size_x: 3.2
    map_size_y: 6.0
    map_size_z: 0.01  # Back to 2D (single layer) for faster processing
    
    # Obstacle inflation radius (meters)
    obstacles_inflation: 0.1
    
    # Frame ID for published messages
    frame_id: "map"
    
    # Local update parameters
    local_map_margin: 5
    local_update_range_x: 1.5  # Local update range in x
    local_update_range_y: 1.5  # Local update range in y
    local_update_range_z: 0.01  # Local update range in z
    enable_local_update: true  # Enable local update optimization
    
    # Visualization parameters
    visualization_truncate_height: 5.0
    esdf_slice_height: 1.0
    
    # Virtual ceiling (disabled by default)
    virtual_ceil_height: -1.0
    ground_height: 0.0

